services:
  frontend:
    image: suffaai/frontend:latest
    container_name: suffaai-frontend
    restart: always
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:5001
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - suffaai_network

networks:
  suffaai_network:
    external: true
